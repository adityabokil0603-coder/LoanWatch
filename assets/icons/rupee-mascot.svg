<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Apna Rupaiyya Mascot">
  <defs>
    <radialGradient id="coinGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="55%" stop-color="#F7C968"/>
      <stop offset="90%" stop-color="#DDA027"/>
      <stop offset="100%" stop-color="#B87B14"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B2"/>
      <stop offset="50%" stop-color="#CA861B"/>
      <stop offset="100%" stop-color="#845308"/>
    </linearGradient>
    <linearGradient id="safaaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B25"/>
      <stop offset="50%" stop-color="#E05315"/>
      <stop offset="100%" stop-color="#A83005"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0F764E"/>
      <stop offset="100%" stop-color="#2DD48F"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0D1B2A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="60" cy="112" rx="38" ry="6" fill="#0D1B2A" opacity="0.16"/>

  <!-- Outer Coin Rim -->
  <circle cx="60" cy="62" r="46" fill="url(#rimGrad)" filter="url(#shadowFilter)"/>
  <!-- Beaded Rim Dots -->
  <circle cx="60" cy="62" r="43.5" fill="none" stroke="#FFE9B8" stroke-width="1.2" stroke-dasharray="2 3"/>
  <!-- Inner Coin Face -->
  <circle cx="60" cy="62" r="40" fill="url(#coinGlow)"/>

  <!-- Subtle Rupee watermark behind face -->
  <text x="60" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#B37812" opacity="0.18" text-anchor="middle">₹</text>

  <!-- Safaa / Festive Turban Accent on top -->
  <g id="turban">
    <!-- Turban base folds -->
    <path d="M 28 36 C 36 20, 84 18, 92 36 C 82 28, 38 28, 28 36 Z" fill="url(#safaaGrad)"/>
    <path d="M 32 35 C 44 24, 76 24, 88 35 C 75 30, 45 30, 32 35 Z" fill="#FFA352" opacity="0.6"/>
    <!-- Central Jewel (Kalgi brooch) -->
    <ellipse cx="60" cy="27" rx="5" ry="6" fill="#0F764E"/>
    <ellipse cx="60" cy="27" rx="3" ry="4" fill="#2DD48F"/>
    <circle cx="59" cy="25.5" r="1.2" fill="#FFFFFF"/>
    <!-- Feather plume -->
    <path d="M 60 22 C 58 12, 63 4, 67 2 C 65 9, 63 15, 60 22 Z" fill="url(#featherGrad)"/>
  </g>

  <!-- Mascot Eyes -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="46" cy="56" rx="5.5" ry="7" fill="#0D1B2A"/>
    <circle cx="44.2" cy="53.8" r="2.2" fill="#FFFFFF"/>
    <circle cx="47.8" cy="58.2" r="1" fill="#FFFFFF"/>
    <!-- Eyebrow -->
    <path d="M 40 46 C 44 43, 49 44, 52 47" fill="none" stroke="#684206" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="74" cy="56" rx="5.5" ry="7" fill="#0D1B2A"/>
    <circle cx="72.2" cy="53.8" r="2.2" fill="#FFFFFF"/>
    <circle cx="75.8" cy="58.2" r="1" fill="#FFFFFF"/>
    <!-- Eyebrow -->
    <path d="M 68 47 C 71 44, 76 43, 80 46" fill="none" stroke="#684206" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Rosy Cheeks -->
  <circle cx="37" cy="65" r="4.5" fill="#E86A33" opacity="0.35"/>
  <circle cx="83" cy="65" r="4.5" fill="#E86A33" opacity="0.35"/>

  <!-- Cheerful Smile -->
  <path d="M 49 67 C 54 75, 66 75, 71 67" fill="none" stroke="#0D1B2A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Open mouth tongue hint -->
  <path d="M 54 71 C 57 74, 63 74, 66 71 Z" fill="#E05315" opacity="0.7"/>

  <!-- Saffron Tilak / Bindi on forehead -->
  <path d="M 60 40 L 61.5 45 C 61.5 46.5, 58.5 46.5, 58.5 45 Z" fill="#D9531E"/>

  <!-- Little hands holding gold coin border / Thumbs up -->
  <g>
    <!-- Left little hand -->
    <circle cx="21" cy="68" r="5" fill="#F7C968" stroke="#CA861B" stroke-width="1.2"/>
    <circle cx="23" cy="66" r="2.5" fill="#F7C968"/>
    <!-- Right Thumbs up hand -->
    <circle cx="99" cy="64" r="5" fill="#F7C968" stroke="#CA861B" stroke-width="1.2"/>
    <path d="M 99 64 L 102 57 C 103 55, 105 56, 104 59 L 102 64 Z" fill="#F7C968" stroke="#CA861B" stroke-width="1"/>
  </g>
</svg>
